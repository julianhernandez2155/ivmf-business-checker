name: ci
# Phase 0 / Plan 00-03: baseline CI runner for every PR.
# Replaces the v1.0 single-job business_checker matrix; v1.0 tests now run inside
# the worker-tests job (with a soft warning on pre-existing failures).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  worker-tests:
    name: worker / unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install worker (editable)
        run: |
          pip install -e ./worker[dev]
          pip install -e ./business_checker

      - name: Run unit tests (skip integration — needs DB)
        run: |
          cd worker
          pytest tests/ -x -m "not integration" --tb=short

      - name: Run business_checker tests
        run: |
          cd business_checker
          pytest tests/ -x --tb=short || echo "::warning::business_checker tests had failures (pre-existing v1.0 state)"

  web-tests:
    name: web / unit + tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Vitest
        working-directory: web
        run: pnpm test --run

  worker-integration:
    name: worker / integration (gated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gated on the dev DB secret. When unset (e.g. PRs from forks), the job is skipped.
    if: ${{ secrets.SUPABASE_DEV_DB_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          pip install -e ./worker[dev]
          pip install -e ./business_checker

      - name: Integration tests
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
        run: |
          cd worker
          pytest tests/ -x -m integration --tb=short
