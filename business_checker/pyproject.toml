[project]
name = "ivmf-business-checker"
version = "1.0.0"
description = "Veteran-owned business operational status verification tool. Built at the Institute for Veterans and Military Families (IVMF), Syracuse University."
authors = [{ name = "Julian Hernandez", email = "julianhernandez2155@gmail.com" }]
license = { text = "MIT" }
readme = "../README.md"
requires-python = ">=3.11"
keywords = ["ivmf", "veteran-owned-business", "perplexity", "operational-status"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime deps live in requirements.txt (pinned). pyproject is metadata + tool config.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    "archive",
    "Runs",
    ".tmp_uploads",
    ".pytest_cache",
    ".ruff_cache",
    "cache",
    "templates",
]
xfail_strict = true
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: fast, isolated unit tests (default)",
    "integration: requires external services (skipped in CI without secrets)",
    "slow: tests that take >1s",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive", "Runs", ".tmp_uploads"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function calls in argument defaults (common in argparse)
    "SIM117", # nested with statements (sometimes clearer)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine
